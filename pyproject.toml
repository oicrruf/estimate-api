[project]
name = "estimate-api"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = ["fastapi==0.115.12", "uvicorn==0.34.2"]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "pytest==8.3.5", "ruff==0.11.10", "mypy==1.15.0", "detect-secrets==1.5.0"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/estimate_api"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
