[project]
name = "estimate-api"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn==0.34.2",
    "jsonschema==4.26.0",
    "pyjwt[crypto]==2.15.1",
    "psycopg[binary]==3.3.8",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==8.3.5",
    "ruff==0.11.10",
    "mypy==1.15.0",
    "detect-secrets==1.5.0",
    "types-jsonschema==4.26.0.20261006",
    "relate-db==1.3.0",
]
demo = [
    "google-adk==1.20.0",
    "relate-db==1.3.0",
]
private-ai = [
    "openai==3.13.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/estimate_api"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
