name: Estimate API CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.3'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.7.6'
      - name: Install pinned dependencies
        run: |
          uv sync --frozen --extra dev
          npm ci --ignore-scripts --no-audit --no-fund --prefix ci/at-206-docs
      - name: Preserve AT-206 architecture evidence
        run: |
          for file in docs/adr/0001-arquitectura-inicial.md docs/evidence/at-206.md openspec/changes/archive/2026-11-26-at-206-arquitectura-inicial/proposal.md openspec/changes/archive/2026-11-26-at-206-arquitectura-inicial/design.md openspec/changes/archive/2026-11-26-at-206-arquitectura-inicial/tasks.md; do
            test -s "$file"
          done
      - name: Verify Python and contract
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          uv run --no-sync mypy src scripts tests
          uv run --no-sync pytest -q
          uv run --no-sync python scripts/openapi.py --check
          uv run --no-sync python scripts/check_secrets.py
      - name: Verify OpenSpec current and archived
        env:
          OPENSPEC_TELEMETRY: '0'
        run: |
          ci/at-206-docs/node_modules/.bin/openspec validate --specs --strict
          ci/at-206-docs/node_modules/.bin/openspec validate --archived --strict
      - name: Build and smoke test local container
        run: |
          docker compose config --quiet
          docker compose up -d --build
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/health | grep -q '"status":"ok"'; then
              docker compose down
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          docker compose down
          exit 1
      - name: Verify PR metadata
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.head_ref }}
        run: uv run --no-sync python scripts/check_policy.py --title "$PR_TITLE" --branch "$PR_BRANCH"
