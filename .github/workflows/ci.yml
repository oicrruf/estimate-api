name: Estimate API CI

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  python-quality:
    name: Python quality (Ruff and mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.7.6'
      - name: Install pinned dependencies
        run: uv sync --frozen --extra dev --extra demo
      - name: Check lint, format, and types
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          uv run --no-sync mypy src scripts tests

  pytest:
    name: Python tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.7.6'
      - name: Install pinned dependencies
        run: uv sync --frozen --extra dev --extra demo
      - name: Run pytest
        run: uv run --no-sync pytest -q

  openapi:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.7.6'
      - name: Install pinned dependencies
        run: uv sync --frozen --extra dev
      - name: Verify generated contract
        run: uv run --no-sync python scripts/openapi.py --check

  openspec-evidence:
    name: OpenSpec and architecture evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.3'
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix ci/at-206-docs
      - name: Preserve AT-206 architecture evidence
        run: |
          for file in docs/adr/0001-arquitectura-inicial.md docs/evidence/at-206.md openspec/changes/archive/2026-11-26-at-206-arquitectura-inicial/proposal.md openspec/changes/archive/2026-11-26-at-206-arquitectura-inicial/design.md openspec/changes/archive/2026-11-26-at-206-arquitectura-inicial/tasks.md; do
            test -s "$file"
          done
      - name: Verify OpenSpec current and archived
        env:
          OPENSPEC_TELEMETRY: '0'
        run: |
          ci/at-206-docs/node_modules/.bin/openspec validate --specs --strict
          ci/at-206-docs/node_modules/.bin/openspec validate --archived --strict

  security-metadata:
    name: Secret scan and PR metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.7.6'
      - name: Install pinned dependencies
        run: uv sync --frozen --extra dev
      - name: Scan for secrets
        run: uv run --no-sync python scripts/check_secrets.py
      - name: Verify PR metadata
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: uv run --no-sync python scripts/check_policy.py --title "$PR_TITLE" --branch "$PR_BRANCH" --commit "$PR_HEAD_SHA"

  container:
    name: Docker build and health smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Build and smoke test local container
        run: |
          docker compose config --quiet
          docker compose up -d --build
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/health | grep -q '"status":"ok"'; then
              docker compose down
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          docker compose down
          exit 1

  verify:
    name: verify
    if: ${{ always() }}
    needs: [python-quality, pytest, openapi, openspec-evidence, security-metadata, container]
    runs-on: ubuntu-latest
    env:
      PYTHON_QUALITY_RESULT: ${{ needs.python-quality.result }}
      PYTEST_RESULT: ${{ needs.pytest.result }}
      OPENAPI_RESULT: ${{ needs.openapi.result }}
      OPENSPEC_EVIDENCE_RESULT: ${{ needs.openspec-evidence.result }}
      SECURITY_METADATA_RESULT: ${{ needs.security-metadata.result }}
      CONTAINER_RESULT: ${{ needs.container.result }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require every phase to succeed
        run: bash ci/at-281/verify-phases.sh
