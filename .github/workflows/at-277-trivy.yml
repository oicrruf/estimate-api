name: AT-277 Trivy API

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  scan:
    name: Trivy API source and built image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Scan source and built image
        env:
          AT277_SUMMARY_PATH: ${{ runner.temp }}/at277-summary.json
        run: bash ci/at-277-trivy/scan.sh
      - name: Publish redacted counts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: at277-api-redacted-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/at277-summary.json
          if-no-files-found: error
          retention-days: 7
