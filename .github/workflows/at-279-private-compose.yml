name: AT-279 private package validation

on:
  pull_request:
    branches: [develop]
    paths:
      - '.github/workflows/at-279-private-compose.yml'
      - 'ci/at-279/**'
      - 'openspec/changes/archive/*at-279-private-compose-validation/**'
      - 'openspec/specs/private-demo-package/**'

permissions:
  contents: read

jobs:
  verify-private-compose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - name: Reconstruct exact public source snapshot and private package hash
        run: ci/at-279/assemble.sh
      - name: Validate private Compose configuration
        working-directory: ci/at-279/package
        run: |
          docker compose config --quiet
          python3 runtime/verify_compose.py
      - name: Build local-only images
        working-directory: ci/at-279/package
        run: docker compose build
      - name: Start synthetic stack and verify real HTTP, graph, and reopen
        working-directory: ci/at-279/package
        run: |
          docker compose up --no-build -d
          python3 ../verify_runtime.py
          python3 ../verify_browser.py
      - name: Remove only this disposable Compose stack
        if: always()
        working-directory: ci/at-279/package
        run: docker compose down -v --remove-orphans

  verify-coolify-git-compose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      COMPOSE_PROJECT_NAME: at279-git-probe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate Git candidate without host ports or published images
        working-directory: ci/at-279/package/runtime
        run: docker compose -f coolify-compose.yaml config --quiet
      - name: Build API and web from fixed public Git commits
        working-directory: ci/at-279/package/runtime
        run: docker compose -f coolify-compose.yaml build
      - name: Start candidate and check real synthetic graph
        working-directory: ci/at-279/package/runtime
        run: |
          docker compose -f coolify-compose.yaml up --no-build -d
          python3 ../../verify_coolify_git.py
      - name: Remove only this disposable Git candidate stack
        if: always()
        working-directory: ci/at-279/package/runtime
        run: docker compose -f coolify-compose.yaml down -v --remove-orphans
