name: AT-229 demo Relate

on:
  pull_request:
    branches:
      - develop
    paths:
      - '.github/workflows/at-229-relate-demo.yml'
      - 'demo/fixtures/**'
      - 'docs/hackathon/**'
      - 'openspec/specs/evidence-graph/**'
      - 'openspec/changes/archive/*at-229-relate-demo/**'

permissions:
  contents: read

jobs:
  verify-relate-fixtures:
    name: Verificar fixtures en Relate 1.3.0
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar wheel oficial con hash fijado
        run: python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: --require-hashes -r demo/fixtures/requirements-ci.txt
      - name: Regenerar y comparar seed
        shell: bash
        run: |
          set -euo pipefail
          python demo/fixtures/build_seed.py
          git diff --exit-code -- demo/fixtures/seed.cypher
      - name: Ejecutar nueve consultas y verificar persistencia
        run: python demo/fixtures/verify_relate.py
