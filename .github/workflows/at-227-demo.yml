name: AT-227 demo local ADK Relate

on:
  pull_request:
    branches: [develop]
    paths:
      - '.github/workflows/at-227-demo.yml'
      - 'demo/agent/**'
      - 'tests/at227/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'openspec/specs/local-agent-demo/**'
      - 'openspec/changes/archive/*at-227-relate-demo/**'
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  verify-local-demo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.7.6'
      - name: Instalar dependencias fijadas
        run: uv sync --frozen --extra dev --extra demo
      - name: Verificar CLI y tipos de la demo
        run: |
          uv run --no-sync ruff check demo/agent tests/at227
          uv run --no-sync ruff format --check demo/agent tests/at227
          uv run --no-sync mypy demo/agent
          uv run --no-sync pytest -q tests/at227
